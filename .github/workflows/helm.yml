name: Helm Chart

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "helm/**"
      - "ct.yaml"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "helm/**"
      - "ct.yaml"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  lint:
    name: helm lint & ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a3c1a3c4c4c4c4c4c4c4c4c4c4c4c4c4c # v4.2.2
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      # Installs ct plus the yamllint / yamale tools it runs.
      - uses: helm/chart-testing-action@e6669bcd63d7cb57cb4380c33043eebe5d111a33 # v2.7.0

      - name: helm lint
        run: helm lint --strict helm/soroban-pulse

      - name: ct lint
        run: ct lint --config ct.yaml --charts helm/soroban-pulse

  release:
    name: Release chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a3c1a3c4c4c4c4c4c4c4c4c4c4c4c4c4c # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: helm
          skip_existing: true