name: Helm Chart

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - "ct.yaml"
      - "Dockerfile"
      - "migrations/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "helm/**"
      - "ct.yaml"
      - "Dockerfile"
      - "migrations/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  lint:
    name: helm lint & ct lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs ct plus the yamllint / yamale tools it runs.
      - uses: helm/chart-testing-action@v2.7.0

      - name: helm lint
        run: helm lint --strict helm/soroban-pulse

      - name: ct lint
        run: ct lint --config ct.yaml --charts helm/soroban-pulse

  install:
    name: ct install (kind)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installs ct plus the yamllint / yamale tools it runs.
      - uses: helm/chart-testing-action@v2.7.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: chart-testing

      - name: Install Postgres
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm install postgres bitnami/postgresql \
            --namespace default \
            --set auth.username=soroban_pulse \
            --set auth.password=soroban_pulse \
            --set auth.database=soroban_pulse \
            --set primary.persistence.enabled=false \
            --wait \
            --timeout 5m

      - name: Build image
        run: docker build -t soroban-pulse:ci .

      - name: Load image into kind
        run: kind load docker-image soroban-pulse:ci --name chart-testing

      - name: ct install
        run: |
          ct install \
            --config ct.yaml \
            --charts helm/soroban-pulse \
            --namespace default \
            --helm-extra-set-args "--set=image.repository=soroban-pulse \
              --set=image.tag=ci \
              --set=image.pullPolicy=IfNotPresent \
              --set=migrationJob.enabled=true \
              --set=networkPolicy.enabled=true \
              --set=env.DATABASE_URL=postgres://soroban_pulse:soroban_pulse@postgres-postgresql.default.svc.cluster.local:5432/soroban_pulse"

      - name: Dump cluster state on failure
        if: failure()
        run: |
          echo "=== kubectl get pods -A ==="
          kubectl get pods -A || true
          echo "=== kubectl get all -n default ==="
          kubectl get all -n default || true
          echo "=== kubectl describe pods -n default ==="
          kubectl describe pods -n default || true
          echo "=== kubectl describe jobs -n default ==="
          kubectl describe jobs -n default || true
          echo "=== kubectl logs -n default (all pods) ==="
          for pod in $(kubectl get pods -n default -o name); do
            echo "--- logs for ${pod} ---"
            kubectl logs -n default "${pod}" --all-containers=true || true
          done